stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

# Cache for faster builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/.m2/repository
    - frontend/node_modules/

# ===== BUILD STAGE =====

build:backend:
  stage: build
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - cd backend
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - backend/target/
    expire_in: 1 hour
  only:
    changes:
      - backend/**/*
      - .gitlab-ci.yml

build:frontend:
  stage: build
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/build/
    expire_in: 1 hour
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml

# Build Docker images
build:backend-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd backend
    - docker build -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA $BACKEND_IMAGE:latest
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $BACKEND_IMAGE:latest
  only:
    - main
    - develop
    - tags

build:frontend-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd frontend
    - docker build --build-arg REACT_APP_API_URL=$REACT_APP_API_URL -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA $FRONTEND_IMAGE:latest
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $FRONTEND_IMAGE:latest
  only:
    - main
    - develop
    - tags

# ===== TEST STAGE =====

test:backend-unit:
  stage: test
  image: maven:3.9.5-eclipse-temurin-17
  dependencies:
    - build:backend
  script:
    - cd backend
    - mvn test
  artifacts:
    when: always
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml
    paths:
      - backend/target/surefire-reports/
  coverage: '/Total.*?([0-9]{1,3})%/'
  only:
    changes:
      - backend/**/*
      - .gitlab-ci.yml

test:backend-integration:
  stage: test
  image: maven:3.9.5-eclipse-temurin-17
  dependencies:
    - build:backend
  script:
    - cd backend
    - mvn verify -DskipUnitTests
  artifacts:
    when: always
    reports:
      junit:
        - backend/target/failsafe-reports/TEST-*.xml
  allow_failure: true
  only:
    changes:
      - backend/**/*
      - .gitlab-ci.yml

test:frontend-unit:
  stage: test
  image: node:18-alpine
  dependencies:
    - build:frontend
  script:
    - cd frontend
    - npm ci
    - npm run test -- --coverage --watchAll=false --passWithNoTests
  artifacts:
    when: always
    paths:
      - frontend/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
  coverage: '/Lines\s*:\s*(\d+.\d+)%/'
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml

test:frontend-lint:
  stage: test
  image: node:18-alpine
  dependencies:
    - build:frontend
  script:
    - cd frontend
    - npm ci
    - npm run lint || echo "Lint issues found but continuing..."
  allow_failure: true
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml

# Code quality check
code_quality:
  stage: test
  image: docker:stable
  services:
    - docker:dind
  script:
    - echo "Code quality check - install SonarQube scanner if needed"
  allow_failure: true

# Security scanning
security:dependency-scan:
  stage: test
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - cd backend
    - mvn org.owasp:dependency-check-maven:check || echo "Security scan completed with warnings"
  artifacts:
    when: always
    paths:
      - backend/target/dependency-check-report.html
  allow_failure: true

# ===== DEPLOY STAGE =====
# Single VM Deployment Strategy:
# - develop branch -> auto deploy to staging environment (port 8080/3000)
# - main branch -> manual deploy to production environment (port 8081/3001)
# Both environments run on the same VM but with different ports and compose files

# Deploy develop branch to staging environment
deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts
  script:
    - |
      ssh $SERVER_USER@$SERVER_IP << 'EOF'
        cd /opt/game-webapp
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        docker-compose -f docker-compose.staging.yml pull
        docker-compose -f docker-compose.staging.yml up -d --force-recreate
        docker-compose -f docker-compose.staging.yml ps
      EOF
  environment:
    name: staging
    url: http://$SERVER_IP:3000
  only:
    - develop
  needs:
    - job: build:backend-image
    - job: build:frontend-image
    - job: test:backend-unit
    - job: test:frontend-unit

# Deploy main branch to production environment
deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts
  script:
    - |
      ssh $SERVER_USER@$SERVER_IP << 'EOF'
        cd /opt/game-webapp
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        docker-compose -f docker-compose.production.yml pull
        docker-compose -f docker-compose.production.yml up -d --force-recreate
        docker-compose -f docker-compose.production.yml ps
        # Clean up old images to save space
        docker image prune -af --filter "until=24h"
      EOF
  environment:
    name: production
    url: http://$SERVER_IP:3001
  when: manual
  only:
    - main
    - tags
  needs:
    - job: build:backend-image
    - job: build:frontend-image
    - job: test:backend-unit
    - job: test:frontend-unit
