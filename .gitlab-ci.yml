  environment:
    name: production
    url: http://$SERVER_IP:3001
  when: manual
  allow_failure: true
  only:
    - main
    - tags
  needs:
    - job: build:backend-image:production
    - job: build:frontend-image:production
    - job: test:backend-unit
      optional: true
    - job: test:frontend-unit
      optional: true
