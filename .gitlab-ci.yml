# ===== DEPLOY STAGE =====
# Single VM Deployment Strategy:
# - develop branch -> auto deploy to staging environment (port 8080/3000)
# - main branch -> manual deploy to production environment (port 8081/3001)
# Both environments run on the same VM but with different ports and compose files

# Deploy develop branch to staging environment
deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client openssh-keygen bash
    - mkdir -p ~/.ssh
    - |
      # Check if SSH_PRIVATE_KEY is configured
      if [ -z "$SSH_PRIVATE_KEY" ]; then
        echo "WARNING: SSH_PRIVATE_KEY is not configured in GitLab CI/CD variables"
        echo "Please add SSH_PRIVATE_KEY in: Settings > CI/CD > Variables"
        echo "Skipping deployment..."
        exit 0
      fi
      
      # Support both GitLab CI variable types:
      # - File variable: $SSH_PRIVATE_KEY contains a path to a temp file
      # - Variable with key content: $SSH_PRIVATE_KEY contains the key text
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        cp "$SSH_PRIVATE_KEY" ~/.ssh/id_rsa
      else
        echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
      fi
    - chmod 600 ~/.ssh/id_rsa
    - |
      # Validate and debug SSH key
      echo "=== SSH Key Diagnostics ==="
      echo "Key size: $(wc -c < ~/.ssh/id_rsa) bytes"
      echo "Key permissions: $(ls -l ~/.ssh/id_rsa | awk '{print $1}')"
      echo "First line (format identifier):"
      head -1 ~/.ssh/id_rsa
      echo "Last line:"
      tail -1 ~/.ssh/id_rsa
      
      # Check if key is encrypted
      if grep -q "ENCRYPTED" ~/.ssh/id_rsa; then
        echo "ERROR: SSH key is encrypted with a passphrase!"
        echo "Please provide an unencrypted SSH private key in GitLab CI/CD variables."
        echo "To remove passphrase: ssh-keygen -p -f your_key -P 'old_passphrase' -N ''"
        exit 1
      fi
      
      # Check for common issues
      if grep -q "\r" ~/.ssh/id_rsa; then
        echo "Warning: Found Windows line endings in key, cleaning..."
        tr -d '\r' < ~/.ssh/id_rsa > ~/.ssh/id_rsa.tmp && mv ~/.ssh/id_rsa.tmp ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
      fi

      
      # Validate key can be read
      echo "Validating key format..."
      if ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub 2>&1; then
        echo "✓ Key validation PASSED"
        echo "Public key fingerprint:"
        ssh-keygen -lf ~/.ssh/id_rsa.pub
      else
        echo "✗ Key validation FAILED"
        echo "Detailed error from ssh-keygen:"
        ssh-keygen -y -f ~/.ssh/id_rsa 2>&1 || true
        echo ""
        echo "First 5 lines of key file:"
        head -5 ~/.ssh/id_rsa
        echo "Last 5 lines of key file:"
        tail -5 ~/.ssh/id_rsa
        echo ""
        echo "Key might be corrupted, encrypted, or in unsupported format."
        echo "Please check your SSH_PRIVATE_KEY variable in GitLab."
        exit 1
      fi
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_rsa
    - |
      # Verify SERVER_IP and SERVER_USER are set
      echo "Checking deployment variables..."
      if [ -z "$SERVER_IP" ]; then
        echo "ERROR: SERVER_IP is not set in GitLab CI/CD variables"
        exit 1
      fi
      if [ -z "$SERVER_USER" ]; then
        echo "ERROR: SERVER_USER is not set in GitLab CI/CD variables"
        exit 1
      fi
      echo "SERVER_IP: $SERVER_IP"
      echo "SERVER_USER: $SERVER_USER"
    - ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts
  script:
    - |
      ssh $SERVER_USER@$SERVER_IP << 'EOF'
        cd /opt/game-webapp
        # Ensure log file exists and is writable
        touch /opt/game-webapp/logcicd.txt
        chmod 644 /opt/game-webapp/logcicd.txt || true

        echo "=== CI/CD $(date '+%Y-%m-%d %H:%M:%S') - STAGING DEPLOY START ===" >> /opt/game-webapp/logcicd.txt

        echo "--- docker login ---" >> /opt/game-webapp/logcicd.txt
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY >> /opt/game-webapp/logcicd.txt 2>&1
        echo "docker login exit:$?" >> /opt/game-webapp/logcicd.txt

        echo "--- docker-compose pull ---" >> /opt/game-webapp/logcicd.txt
        docker-compose -f docker-compose.staging.yml pull >> /opt/game-webapp/logcicd.txt 2>&1
        echo "pull exit:$?" >> /opt/game-webapp/logcicd.txt

        echo "--- docker-compose up ---" >> /opt/game-webapp/logcicd.txt
        docker-compose -f docker-compose.staging.yml up -d --force-recreate >> /opt/game-webapp/logcicd.txt 2>&1
        echo "up exit:$?" >> /opt/game-webapp/logcicd.txt

        echo "--- docker-compose ps ---" >> /opt/game-webapp/logcicd.txt
        docker-compose -f docker-compose.staging.yml ps >> /opt/game-webapp/logcicd.txt 2>&1
        echo "ps exit:$?" >> /opt/game-webapp/logcicd.txt

        echo "=== CI/CD $(date '+%Y-%m-%d %H:%M:%S') - STAGING DEPLOY END ===" >> /opt/game-webapp/logcicd.txt
      EOF
  environment:
    name: staging
    url: http://$SERVER_IP:3001
  only:
    - develop
  needs:
    - job: build:backend-image:staging
      optional: true
    - job: build:frontend-image:staging
      optional: true
    - job: test:backend-unit
      optional: true
    - job: test:frontend-unit
      optional: true

