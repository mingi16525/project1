# Build Docker images for staging (develop branch)
build:backend-image:staging:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - |
     echo "=== Starting Backend Image Build for Staging ===" 
     echo "Branch: $CI_COMMIT_REF_NAME"
     echo "Commit: $CI_COMMIT_SHORT_SHA"
     echo "Backend Image: $BACKEND_IMAGE"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd backend
    - | 
     echo "Building image: $BACKEND_IMAGE:staging-$CI_COMMIT_SHORT_SHA"
    - docker build -t $BACKEND_IMAGE:staging-$CI_COMMIT_SHORT_SHA .
    - docker tag $BACKEND_IMAGE:staging-$CI_COMMIT_SHORT_SHA $BACKEND_IMAGE:staging
    - | 
     echo "Pushing image: $BACKEND_IMAGE:staging-$CI_COMMIT_SHORT_SHA"
    - docker push $BACKEND_IMAGE:staging-$CI_COMMIT_SHORT_SHA
    - | 
     echo "Pushing image: $BACKEND_IMAGE:staging"
    - docker push $BACKEND_IMAGE:staging
    - echo "✓ Backend staging build completed successfully"
  only:
    changes:
      - CI_COMMIT_REF_NAME == "develop"
      - backend/**/*
      - .gitlab-ci.yml

build:frontend-image:staging:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - |
      echo "=== Starting Frontend Image Build for Staging ==="
      echo "Branch: $CI_COMMIT_REF_NAME"
      echo "Commit: $CI_COMMIT_SHORT_SHA"
      echo "Frontend Image: $FRONTEND_IMAGE"
      echo "API URL: $REACT_APP_API_URL"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd frontend
    - |
     echo "Building image: $FRONTEND_IMAGE:staging-$CI_COMMIT_SHORT_SHA"
     echo "API URL: $REACT_APP_API_URL"
     if [ -z "$REACT_APP_API_URL" ]; then
       echo "WARNING: REACT_APP_API_URL is not set, using default"
       REACT_APP_API_URL="http://152.42.196.25:8081"
     fi
     echo "Using API URL: $REACT_APP_API_URL"
    - docker build --build-arg REACT_APP_API_URL=$REACT_APP_API_URL -t $FRONTEND_IMAGE:staging-$CI_COMMIT_SHORT_SHA .
    - docker tag $FRONTEND_IMAGE:staging-$CI_COMMIT_SHORT_SHA $FRONTEND_IMAGE:staging
    - |
      echo "Pushing image: $FRONTEND_IMAGE:staging-$CI_COMMIT_SHORT_SHA"
    - docker push $FRONTEND_IMAGE:staging-$CI_COMMIT_SHORT_SHA
    - |
      echo "Pushing image: $FRONTEND_IMAGE:staging"
    - docker push $FRONTEND_IMAGE:staging
    - echo "✓ Frontend staging build completed successfully"
  only:
    changes:
      - CI_COMMIT_REF_NAME == "develop"
      - frontend/**/*
      - .gitlab-ci.yml
      
    

# Build Docker images for production (main branch)
build:backend-image:production:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - |
      echo "=== Starting Backend Image Build for Production ==="
      echo "Branch: $CI_COMMIT_REF_NAME"
      echo "Commit: $CI_COMMIT_SHORT_SHA"
      echo "Backend Image: $BACKEND_IMAGE"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd backend
    - |
      echo "Building image: $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker build -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA $BACKEND_IMAGE:latest
    - |
      echo "Pushing image: $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - |
      echo "Pushing image: $BACKEND_IMAGE:latest"
    - docker push $BACKEND_IMAGE:latest
    - echo "✓ Backend production build completed successfully"
  only:
    - main
    - tags

build:frontend-image:production:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - |
      echo "=== Starting Frontend Image Build for Production ==="
      echo " Branch: $CI_COMMIT_REF_NAME"
      echo "Commit: $CI_COMMIT_SHORT_SHA"
      echo "Frontend Image: $FRONTEND_IMAGE"
      echo "API URL: $REACT_APP_API_URL"
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd frontend
    - |
      echo "Building image: $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
      echo "API URL: $REACT_APP_API_URL"
      if [ -z "$REACT_APP_API_URL" ]; then
       echo "WARNING: REACT_APP_API_URL is not set, using default"
       REACT_APP_API_URL="https://prj1mg.me"
      fi
      echo "Using API URL: $REACT_APP_API_URL"
    - docker build --build-arg REACT_APP_API_URL=$REACT_APP_API_URL -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA $FRONTEND_IMAGE:latest
    - |
      echo "Pushing image: $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - |
      echo "Pushing image: $FRONTEND_IMAGE:latest"
    - docker push $FRONTEND_IMAGE:latest
    - echo "✓ Frontend production build completed successfully"
  only:
    - main
    - tags

# ===== TEST STAGE =====

test:backend-unit:
  stage: test
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - cd backend
    - mvn test
  artifacts:
    when: always
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml
    paths:
      - backend/target/surefire-reports/
  coverage: '/Total.*?([0-9]{1,3})%/'
  allow_failure: true
  # Run on every pipeline/commit (no file-change filter)

test:backend-integration:
  stage: test
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - cd backend
    - mvn verify -DskipUnitTests
  artifacts:
    when: always
    reports:
      junit:
        - backend/target/failsafe-reports/TEST-*.xml
  allow_failure: true
  # Run on every pipeline/commit (no file-change filter)

test:frontend-unit:
  stage: test
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm run test -- --coverage --watchAll=false --passWithNoTests
  artifacts:
    when: always
    paths:
      - frontend/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
  coverage: '/Lines\s*:\s*(\d+.\d+)%/'
  allow_failure: true
  # Run on every pipeline/commit (no file-change filter)

test:frontend-lint:
  stage: test
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm run lint || echo "Lint issues found but continuing..."
  allow_failure: true
  # Run on every pipeline/commit (no file-change filter)

# Code quality check
code_quality:
  stage: test
  image: docker:stable
  services:
    - docker:dind
  script:
    - echo "Code quality check - install SonarQube scanner if needed"
  allow_failure: true

