# ===== DEPLOY STAGE =====
# Single VM Deployment Strategy:
# - develop branch -> auto deploy to staging environment (port 8080/3000)
# - main branch -> manual deploy to production environment (port 8081/3001)
# Both environments run on the same VM but with different ports and compose files

# Deploy develop branch to staging environment
deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - |
      # Support both GitLab CI variable types:
      # - File variable: $SSH_PRIVATE_KEY contains a path to a temp file
      # - Variable with key content: $SSH_PRIVATE_KEY contains the key text
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        cp "$SSH_PRIVATE_KEY" ~/.ssh/id_rsa
      else
        echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
      fi
    - chmod 600 ~/.ssh/id_rsa
    - |
      # Convert OpenSSH format to PEM for compatibility with older crypto libraries
      if grep -q "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/id_rsa; then
        echo "Converting OpenSSH key to PEM format..."
        # Create backup of original key
        cp ~/.ssh/id_rsa ~/.ssh/id_rsa.backup
        # Convert to PEM format (no passphrase)
        ssh-keygen -p -m PEM -f ~/.ssh/id_rsa -P "" -N "" 2>/dev/null || {
          echo "Warning: Key conversion failed. Using original key."
          mv ~/.ssh/id_rsa.backup ~/.ssh/id_rsa
        }
        # Verify conversion
        if grep -q "BEGIN RSA PRIVATE KEY" ~/.ssh/id_rsa || grep -q "BEGIN EC PRIVATE KEY" ~/.ssh/id_rsa; then
          echo "Successfully converted to PEM format"
          rm -f ~/.ssh/id_rsa.backup
        fi
      fi
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts
  script:
    - |
      ssh $SERVER_USER@$SERVER_IP << 'EOF'
        cd /opt/game-webapp
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        docker-compose -f docker-compose.staging.yml pull
        docker-compose -f docker-compose.staging.yml up -d --force-recreate
        docker-compose -f docker-compose.staging.yml ps
      EOF
  environment:
    name: staging
    url: http://$SERVER_IP:3000
  only:
    - develop
  needs:
    - job: build:backend-image
    - job: build:frontend-image
    - job: test:backend-unit
      optional: true
    - job: test:frontend-unit
      optional: true

# Deploy main branch to production environment
deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - |
      # Support both GitLab CI variable types:
      # - File variable: $SSH_PRIVATE_KEY contains a path to a temp file
      # - Variable with key content: $SSH_PRIVATE_KEY contains the key text
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        cp "$SSH_PRIVATE_KEY" ~/.ssh/id_rsa
      else
        echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
      fi
    - chmod 600 ~/.ssh/id_rsa
    - |
      # Convert OpenSSH format to PEM for compatibility with older crypto libraries
      if grep -q "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/id_rsa; then
        echo "Converting OpenSSH key to PEM format..."
        # Create backup of original key
        cp ~/.ssh/id_rsa ~/.ssh/id_rsa.backup
        # Convert to PEM format (no passphrase)
        ssh-keygen -p -m PEM -f ~/.ssh/id_rsa -P "" -N "" 2>/dev/null || {
          echo "Warning: Key conversion failed. Using original key."
          mv ~/.ssh/id_rsa.backup ~/.ssh/id_rsa
        }
        # Verify conversion
        if grep -q "BEGIN RSA PRIVATE KEY" ~/.ssh/id_rsa || grep -q "BEGIN EC PRIVATE KEY" ~/.ssh/id_rsa; then
          echo "Successfully converted to PEM format"
          rm -f ~/.ssh/id_rsa.backup
        fi
      fi
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_rsa
    - ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts
  script:
    - |
      ssh $SERVER_USER@$SERVER_IP << 'EOF'
        cd /opt/game-webapp
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        docker-compose -f docker-compose.production.yml pull
        docker-compose -f docker-compose.production.yml up -d --force-recreate
        docker-compose -f docker-compose.production.yml ps
        # Clean up old images to save space
        docker image prune -af --filter "until=24h"
      EOF
  environment:
    name: production
    url: http://$SERVER_IP:3001
  when: manual
  only:
    - main
    - tags
  needs:
    - job: build:backend-image
    - job: build:frontend-image
    - job: test:backend-unit
      optional: true
    - job: test:frontend-unit
      optional: true
