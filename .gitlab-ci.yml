stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

# Cache for faster builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/.m2/repository
    - frontend/node_modules/

# ===== BUILD STAGE =====

build:backend:
  stage: build
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - cd backend
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - backend/target/
    expire_in: 1 hour
  only:
    changes:
      - backend/**/*
      - .gitlab-ci.yml

build:frontend:
  stage: build
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/build/
    expire_in: 1 hour
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml

# Build Docker images
build:backend-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd backend
    - docker build -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA $BACKEND_IMAGE:latest
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $BACKEND_IMAGE:latest
  only:
    - main
    - develop
    - tags

build:frontend-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd frontend
    - docker build 
        --build-arg REACT_APP_API_URL=$REACT_APP_API_URL 
        -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA $FRONTEND_IMAGE:latest
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $FRONTEND_IMAGE:latest
  only:
    - main
    - develop
    - tags

# ===== TEST STAGE =====

test:backend-unit:
  stage: test
  image: maven:3.9.5-eclipse-temurin-17
  dependencies:
    - build:backend
  script:
    - cd backend
    - mvn test
  artifacts:
    when: always
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml
    paths:
      - backend/target/surefire-reports/
  coverage: '/Total.*?([0-9]{1,3})%/'
  only:
    changes:
      - backend/**/*
      - .gitlab-ci.yml

test:backend-integration:
  stage: test
  image: maven:3.9.5-eclipse-temurin-17
  dependencies:
    - build:backend
  script:
    - cd backend
    - mvn verify -DskipUnitTests
  artifacts:
    when: always
    reports:
      junit:
        - backend/target/failsafe-reports/TEST-*.xml
  allow_failure: true
  only:
    changes:
      - backend/**/*
      - .gitlab-ci.yml

test:frontend-unit:
  stage: test
  image: node:18-alpine
  dependencies:
    - build:frontend
  script:
    - cd frontend
    - npm ci
    - npm run test -- --coverage --watchAll=false --passWithNoTests
  artifacts:
    when: always
    paths:
      - frontend/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
  coverage: '/Lines\s*:\s*(\d+.\d+)%/'
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml

test:frontend-lint:
  stage: test
  image: node:18-alpine
  dependencies:
    - build:frontend
  script:
    - cd frontend
    - npm ci
    - npm run lint || echo "Lint issues found but continuing..."
  allow_failure: true
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml

# Code quality check
code_quality:
  stage: test
  image: docker:stable
  services:
    - docker:dind
  script:
    - echo "Code quality check - install SonarQube scanner if needed"
  allow_failure: true

# Security scanning
security:dependency-scan:
  stage: test
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - cd backend
    - mvn org.owasp:dependency-check-maven:check || echo "Security scan completed with warnings"
  artifacts:
    when: always
    paths:
      - backend/target/dependency-check-report.html
  allow_failure: true

# ===== DEPLOY STAGE =====

# Deploy to Staging
deploy:staging:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build:backend-image
    - build:frontend-image
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $STAGING_SERVER_IP >> ~/.ssh/known_hosts
  script:
    - |
      ssh $STAGING_USER@$STAGING_SERVER_IP << 'EOF'
        cd /opt/game-webapp
        docker-compose pull
        docker-compose up -d --force-recreate
        docker system prune -f
      EOF
  environment:
    name: staging
    url: https://staging.yourgame.com
  only:
    - develop
  needs:
    - job: test:backend-unit
    - job: test:frontend-unit

# Deploy to Production
deploy:production:
  stage: deploy
  image: alpine:latest
  dependencies:
    - build:backend-image
    - build:frontend-image
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $PROD_SERVER_IP >> ~/.ssh/known_hosts
  script:
    - |
      ssh $PROD_USER@$PROD_SERVER_IP << 'EOF'
        cd /opt/game-webapp
        docker-compose -f docker-compose.prod.yml pull
        docker-compose -f docker-compose.prod.yml up -d --force-recreate
        docker system prune -f
      EOF
  environment:
    name: production
    url: https://yourgame.com
  when: manual
  only:
    - main
    - tags
  needs:
    - job: test:backend-unit
    - job: test:frontend-unit

# Deploy to Kubernetes (optional)
deploy:kubernetes:
  stage: deploy
  image: bitnami/kubectl:latest
  dependencies:
    - build:backend-image
    - build:frontend-image
  script:
    - kubectl config set-cluster k8s --server="$KUBE_URL" --insecure-skip-tls-verify=true
    - kubectl config set-credentials admin --token="$KUBE_TOKEN"
    - kubectl config set-context default --cluster=k8s --user=admin
    - kubectl config use-context default
    - kubectl set image deployment/game-backend game-backend=$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA -n game-webapp
    - kubectl set image deployment/game-frontend game-frontend=$FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA -n game-webapp
    - kubectl rollout status deployment/game-backend -n game-webapp
    - kubectl rollout status deployment/game-frontend -n game-webapp
  environment:
    name: kubernetes
    url: https://yourgame.com
  when: manual
  only:
    - main
    - tags
  needs:
    - job: test:backend-unit
    - job: test:frontend-unit
