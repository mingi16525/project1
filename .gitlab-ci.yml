stages:
  - build
  - test
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

# Cache for faster builds
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/.m2/repository
    - frontend/node_modules/

# ===== BUILD STAGE =====

build:backend:
  stage: build
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - cd backend
    - mvn clean compile -DskipTests
  artifacts:
    paths:
      - backend/target/
    expire_in: 1 hour
  only:
    changes:
      - backend/**/*
      - .gitlab-ci.yml

build:frontend:
  stage: build
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/build/
    expire_in: 1 hour
  only:
    changes:
      - frontend/**/*
      - .gitlab-ci.yml

# Build Docker images for staging (develop branch)
build:backend-image:staging:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd backend
    - docker build -t $BACKEND_IMAGE:staging-$CI_COMMIT_SHORT_SHA .
    - docker tag $BACKEND_IMAGE:staging-$CI_COMMIT_SHORT_SHA $BACKEND_IMAGE:staging
    - docker push $BACKEND_IMAGE:staging-$CI_COMMIT_SHORT_SHA
    - docker push $BACKEND_IMAGE:staging
  only:
    - develop

build:frontend-image:staging:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd frontend
    - docker build --build-arg REACT_APP_API_URL=$REACT_APP_API_URL -t $FRONTEND_IMAGE:staging-$CI_COMMIT_SHORT_SHA .
    - docker tag $FRONTEND_IMAGE:staging-$CI_COMMIT_SHORT_SHA $FRONTEND_IMAGE:staging
    - docker push $FRONTEND_IMAGE:staging-$CI_COMMIT_SHORT_SHA
    - docker push $FRONTEND_IMAGE:staging
  only:
    - develop

# Build Docker images for production (main branch)
build:backend-image:production:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd backend
    - docker build -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA $BACKEND_IMAGE:latest
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $BACKEND_IMAGE:latest
  only:
    - main
    - tags

build:frontend-image:production:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd frontend
    - docker build --build-arg REACT_APP_API_URL=$REACT_APP_API_URL -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker tag $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA $FRONTEND_IMAGE:latest
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $FRONTEND_IMAGE:latest
  only:
    - main
    - tags

# ===== TEST STAGE =====

test:backend-unit:
  stage: test
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - cd backend
    - mvn test
  artifacts:
    when: always
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml
    paths:
      - backend/target/surefire-reports/
  coverage: '/Total.*?([0-9]{1,3})%/'
  # Run on every pipeline/commit (no file-change filter)

test:backend-integration:
  stage: test
  image: maven:3.9.5-eclipse-temurin-17
  script:
    - cd backend
    - mvn verify -DskipUnitTests
  artifacts:
    when: always
    reports:
      junit:
        - backend/target/failsafe-reports/TEST-*.xml
  allow_failure: true
  # Run on every pipeline/commit (no file-change filter)

test:frontend-unit:
  stage: test
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm run test -- --coverage --watchAll=false --passWithNoTests
  artifacts:
    when: always
    paths:
      - frontend/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
  coverage: '/Lines\s*:\s*(\d+.\d+)%/'
  # Run on every pipeline/commit (no file-change filter)

test:frontend-lint:
  stage: test
  image: node:18-alpine
  script:
    - cd frontend
    - npm ci
    - npm run lint || echo "Lint issues found but continuing..."
  allow_failure: true
  # Run on every pipeline/commit (no file-change filter)

# Code quality check
code_quality:
  stage: test
  image: docker:stable
  services:
    - docker:dind
  script:
    - echo "Code quality check - install SonarQube scanner if needed"
  allow_failure: true

