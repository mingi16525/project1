version: '3.8'

services:
  backend-staging:
    image: registry.gitlab.com/migin165/project1/backend:staging
    container_name: game-backend-staging
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=staging
      - SERVER_PORT=8080
      - cors.allowed.origins=http://152.42.196.25:3000,http://localhost:3000
      - CORS_ALLOWED_ORIGINS=http://152.42.196.25:3000,http://localhost:3000
    volumes:
      - /opt/game/data:/app/data
      - ./logs/backend/staging:/app/logs
    networks:
      - game-network-staging

  frontend-staging:
    image: registry.gitlab.com/migin165/project1/frontend:staging
    container_name: game-frontend-staging
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://152.42.196.25:8080
    depends_on:
      - backend-staging
    networks:
      - game-network-staging

networks:
  game-network-staging:
    driver: bridge
    name: game-staging-network